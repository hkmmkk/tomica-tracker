<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トミカ コレクション トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
  --bg:#f2f1ed;--surf:#fafaf7;--surf2:#fff;--surfo:#e8e6e0;
  --div:#dddbd5;--bdr:#d0cdc7;
  --tx:#1a1814;--txm:#6b6965;--txf:#aaa9a5;--txi:#fff;
  --red:#c41e1e;--redh:#a31515;--redhi:#fce8e8;
  --gold:#b87a00;--goldbg:#fdf6e3;--goldbdr:#e8c966;
  --blue:#1a5fa8;--bluebg:#e8f0fb;--bluebdr:#6fa3dc;
  --grn:#2a7a2a;--grnbg:#e8f5e8;
  --sh1:0 1px 3px rgba(0,0,0,.07);--sh2:0 4px 16px rgba(0,0,0,.10);--sh3:0 12px 36px rgba(0,0,0,.13);
  --r1:.375rem;--r2:.5rem;--r3:.75rem;--r4:1.125rem;--rf:9999px;
  --fd:'Oswald',sans-serif;--fb:'Noto Sans JP',sans-serif;
  --xs:clamp(.7rem,.65rem+.2vw,.8rem);--sm:clamp(.8rem,.75rem+.3vw,.9rem);
  --base:clamp(.9rem,.85rem+.25vw,1rem);--lg:clamp(1.1rem,.95rem+.7vw,1.4rem);--xl:clamp(1.4rem,1.1rem+1.2vw,2rem);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--s6:1.5rem;--s8:2rem;--s10:2.5rem;--s12:3rem;--s16:4rem;
  --tr:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --bg:#111009;--surf:#1a1916;--surf2:#222018;--surfo:#181715;
  --div:#2a2824;--bdr:#363330;
  --tx:#d5d2cc;--txm:#7a7773;--txf:#4e4c48;--txi:#fff;
  --red:#e03535;--redh:#f05050;--redhi:#3a1a1a;
  --gold:#d4a020;--goldbg:#2a2210;--goldbdr:#6a5010;
  --blue:#5090d8;--bluebg:#121e2e;--bluebdr:#1e3a5a;
  --grn:#4caf50;--grnbg:#0f2210;
  --sh1:0 1px 3px rgba(0,0,0,.3);--sh2:0 4px 16px rgba(0,0,0,.4);--sh3:0 12px 36px rgba(0,0,0,.5);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#111009;--surf:#1a1916;--surf2:#222018;--surfo:#181715;--div:#2a2824;--bdr:#363330;
  --tx:#d5d2cc;--txm:#7a7773;--txf:#4e4c48;--txi:#fff;--red:#e03535;--redh:#f05050;--redhi:#3a1a1a;
  --gold:#d4a020;--goldbg:#2a2210;--goldbdr:#6a5010;--blue:#5090d8;--bluebg:#121e2e;--bluebdr:#1e3a5a;
  --grn:#4caf50;--grnbg:#0f2210;
  --sh1:0 1px 3px rgba(0,0,0,.3);--sh2:0 4px 16px rgba(0,0,0,.4);--sh3:0 12px 36px rgba(0,0,0,.5);
}}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--fb);font-size:var(--base);color:var(--tx);background:var(--bg);transition:background var(--tr),color var(--tr)}
img,svg{display:block;max-width:100%}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ══ AUTH SCREEN ══ */
#auth-screen{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:var(--s4);
}
.auth-box{
  background:var(--surf2);border-radius:var(--r4);
  box-shadow:var(--sh3);width:100%;max-width:400px;overflow:hidden;
}
.auth-header{
  background:var(--red);padding:var(--s6);
  display:flex;flex-direction:column;align-items:center;gap:var(--s3);color:#fff;
}
.auth-logo{display:flex;align-items:center;gap:var(--s3)}
.auth-title{font-family:var(--fd);font-size:var(--xl);font-weight:700;letter-spacing:.06em}
.auth-sub{font-size:var(--xs);opacity:.8;letter-spacing:.08em}
.auth-tabs{display:flex;border-bottom:1px solid var(--div)}
.atab{flex:1;padding:var(--s3) var(--s4);font-size:var(--sm);font-weight:600;color:var(--txm);border-bottom:2.5px solid transparent;transition:all var(--tr);text-align:center}
.atab.on{color:var(--red);border-bottom-color:var(--red)}
.auth-body{padding:var(--s6)}
.auth-form{display:flex;flex-direction:column;gap:var(--s4)}
.auth-form.hidden{display:none}
.f-lbl{font-size:var(--xs);color:var(--txm);margin-bottom:var(--s1);display:block}
.f-inp{
  width:100%;padding:var(--s3) var(--s4);
  border:1.5px solid var(--bdr);border-radius:var(--r2);
  background:var(--surf);font-size:var(--sm);
  transition:border-color var(--tr),box-shadow var(--tr);
}
.f-inp:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--redhi)}
.f-group{display:flex;flex-direction:column;gap:var(--s1)}
.btn-primary{
  width:100%;padding:var(--s3) var(--s4);border-radius:var(--r2);
  font-size:var(--sm);font-weight:700;background:var(--red);color:#fff;border:none;
  transition:background var(--tr),transform var(--tr);
}
.btn-primary:hover{background:var(--redh)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.auth-err{
  font-size:var(--xs);color:var(--red);
  background:var(--redhi);padding:var(--s2) var(--s3);
  border-radius:var(--r1);display:none;
}
.auth-err.show{display:block}
.auth-ok{
  font-size:var(--xs);color:var(--grn);
  background:var(--grnbg);padding:var(--s2) var(--s3);
  border-radius:var(--r1);display:none;
}
.auth-ok.show{display:block}
.auth-loading{text-align:center;color:var(--txm);font-size:var(--sm);padding:var(--s8)}
.spinner{
  width:32px;height:32px;border:3px solid var(--div);border-top-color:var(--red);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto var(--s3);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ APP (hidden until logged in) ══ */
#app{display:none}
#app.visible{display:block}

/* ══ HEADER ══ */
.hdr{position:sticky;top:0;z-index:100;background:var(--red);box-shadow:0 2px 16px rgba(0,0,0,.28)}
.hdr-i{max-width:1340px;margin:0 auto;padding:0 var(--s6);display:flex;align-items:center;gap:var(--s4);height:58px}
.logo{display:flex;align-items:center;gap:var(--s3);color:#fff;flex-shrink:0}
.logo-svg{width:34px;height:34px}
.logo-text{font-family:var(--fd);font-size:1.25rem;font-weight:700;letter-spacing:.06em;line-height:1}
.logo-sub{font-size:var(--xs);opacity:.75;letter-spacing:.08em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.user-chip{
  display:flex;align-items:center;gap:var(--s2);
  background:rgba(255,255,255,.15);border-radius:var(--rf);
  padding:var(--s1) var(--s3);font-size:var(--xs);color:#fff;
  max-width:160px;
}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:34px;height:34px;border-radius:var(--rf);
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.15);color:#fff;
  transition:background var(--tr);flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,255,255,.28)}

/* ══ STATS ══ */
.stats{background:var(--surf);border-bottom:1px solid var(--div);padding:var(--s4) var(--s6)}
.stats-i{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--s4) var(--s8);align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-lbl{font-size:var(--xs);color:var(--txm);text-transform:uppercase;letter-spacing:.07em}
.stat-val{font-family:var(--fd);font-size:var(--lg);font-weight:600;line-height:1.1}
.vr{color:var(--red)}.vg{color:var(--gold)}.vb{color:var(--blue)}
.prog-wrap{flex:1;min-width:200px}
.prog-bar{height:9px;border-radius:var(--rf);background:var(--surfo);overflow:hidden;margin-bottom:var(--s1)}
.prog-fill{height:100%;border-radius:var(--rf);background:linear-gradient(90deg,var(--red),var(--gold));transition:width .7s cubic-bezier(.16,1,.3,1)}
.prog-lbl{font-size:var(--xs);color:var(--txm);text-align:right}

/* ══ SYNC STATUS ══ */
.sync-bar{
  background:var(--surf);border-bottom:1px solid var(--div);
  padding:var(--s1) var(--s6);display:flex;align-items:center;gap:var(--s2);
  font-size:var(--xs);color:var(--txm);min-height:28px;
}
.sync-bar.hidden{display:none}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--txf);flex-shrink:0}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.sync-dot.saved{background:var(--grn)}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ══ CONTROLS ══ */
.ctrl{background:var(--surf);border-bottom:1px solid var(--div);padding:var(--s3) var(--s6);position:sticky;top:58px;z-index:90}
.ctrl-i{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.srch-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
.srch-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--txm);pointer-events:none}
.srch{width:100%;padding:var(--s2) var(--s3) var(--s2) 34px;border:1.5px solid var(--bdr);border-radius:var(--r2);background:var(--surf2);font-size:var(--sm);transition:border-color var(--tr),box-shadow var(--tr)}
.srch:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--redhi)}
.fbtns{display:flex;gap:var(--s2);flex-wrap:wrap}
.fb{padding:var(--s1) var(--s3);border-radius:var(--rf);font-size:var(--xs);font-weight:500;border:1.5px solid var(--bdr);background:var(--surf2);color:var(--txm);transition:all var(--tr)}
.fb:hover{border-color:var(--red);color:var(--red)}
.fb.on{border-color:var(--red);background:var(--red);color:#fff}
.fb.gold.on{border-color:var(--gold);background:var(--gold);color:#fff}
.fb.blue.on{border-color:var(--blue);background:var(--blue);color:#fff}
.sel{padding:var(--s1) var(--s3);border-radius:var(--r2);font-size:var(--xs);border:1.5px solid var(--bdr);background:var(--surf2);color:var(--tx);transition:border-color var(--tr)}
.sel:focus{outline:none;border-color:var(--red)}
.vtog{display:flex;gap:2px;background:var(--surfo);border-radius:var(--r2);padding:2px}
.vb-btn{padding:var(--s1) var(--s2);border-radius:calc(var(--r2) - 2px);font-size:var(--xs);transition:all var(--tr);color:var(--txm)}
.vb-btn.on{background:var(--surf2);color:var(--tx);box-shadow:var(--sh1)}

/* ══ MAIN ══ */
.main{max-width:1340px;margin:0 auto;padding:var(--s6) var(--s6) var(--s16)}

/* ══ GRID ══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:var(--s4)}
.grid.hidden{display:none}

/* ══ CARD ══ */
.card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:var(--r3);overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;transition:box-shadow var(--tr),transform var(--tr),border-color var(--tr)}
.card:hover{box-shadow:var(--sh2);transform:translateY(-3px);border-color:var(--red)}
.card:active{transform:translateY(-1px)}
.card.coll{border-color:var(--goldbdr);background:var(--goldbg)}
.card.wish{border-color:var(--bluebdr);background:var(--bluebg)}
.card.coll.wish{border-color:var(--goldbdr)}
.c-num{position:absolute;top:0;left:0;z-index:2;font-family:var(--fd);font-size:var(--xs);font-weight:700;letter-spacing:.04em;background:var(--red);color:#fff;padding:2px 7px;border-radius:0 0 var(--r1) 0;line-height:1.4}
.card.coll .c-num{background:var(--gold)}
.card.wish .c-num{background:var(--blue)}
.card.coll.wish .c-num{background:var(--gold)}
.c-badges{position:absolute;top:var(--s1);right:var(--s1);z-index:2;display:flex;gap:2px}
.bdg{width:18px;height:18px;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.bdg-c{background:var(--gold);color:#fff}.bdg-w{background:var(--blue);color:#fff}
.c-img-wrap{width:100%;aspect-ratio:4/3;background:var(--surfo);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.c-img{width:100%;height:100%;object-fit:contain;padding:var(--s3);transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s}
.card:hover .c-img{transform:scale(1.08)}
.c-img.loading{opacity:0}.c-img.loaded{opacity:1}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.c-skel,.l-skel,.m-skel{background:linear-gradient(90deg,var(--surfo) 25%,var(--surf2) 50%,var(--surfo) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.c-skel{position:absolute;inset:0}
.c-img.loaded~.c-skel,.c-img.err~.c-skel{display:none}
.c-fallback{display:none;font-size:2.4rem;position:absolute;inset:0;align-items:center;justify-content:center}
.c-img.err~.c-fallback{display:flex}
.c-body{padding:var(--s2) var(--s3) var(--s1);flex:1;display:flex;flex-direction:column;gap:1px}
.c-name{font-size:var(--xs);font-weight:700;line-height:1.35}
.c-brand{font-size:var(--xs);color:var(--txm)}
.c-stars{font-size:10px;color:var(--gold);line-height:1;margin-top:2px}
.c-note{font-size:9px;color:var(--txm);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:2px}
.c-actions{display:flex;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3)}
.act{flex:1;min-height:30px;padding:2px var(--s2);border-radius:var(--r1);border:1.5px solid var(--bdr);font-size:10px;font-weight:600;background:var(--surf2);color:var(--txm);display:flex;align-items:center;justify-content:center;gap:3px;transition:all var(--tr)}
.act:hover:not(.ac-c):not(.ac-w){border-color:var(--gold);color:var(--gold)}
.act.wb:hover:not(.ac-w){border-color:var(--blue);color:var(--blue)}
.act.ac-c{border-color:var(--gold);background:var(--gold);color:#fff}
.act.ac-w{border-color:var(--blue);background:var(--blue);color:#fff}

/* ══ LIST VIEW ══ */
.listv{display:none;flex-direction:column;gap:var(--s2)}
.listv.vis{display:flex}
.lrow{display:flex;align-items:center;gap:var(--s4);background:var(--surf);border:1.5px solid var(--bdr);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all var(--tr)}
.lrow:hover{border-color:var(--red);box-shadow:var(--sh1);transform:translateX(3px)}
.lrow.coll{border-color:var(--goldbdr);background:var(--goldbg)}
.lrow.wish{border-color:var(--bluebdr);background:var(--bluebg)}
.l-img-wrap{width:80px;height:60px;flex-shrink:0;overflow:hidden;background:var(--surfo);display:flex;align-items:center;justify-content:center;position:relative}
.l-img{width:100%;height:100%;object-fit:contain;padding:var(--s2);transition:opacity .3s}
.l-img.loading{opacity:0}.l-img.loaded{opacity:1}
.l-skel{position:absolute;inset:0}
.l-img.loaded~.l-skel,.l-img.err~.l-skel{display:none}
.l-fallback{display:none;font-size:1.5rem;position:absolute;inset:0;align-items:center;justify-content:center}
.l-img.err~.l-fallback{display:flex}
.l-num{font-family:var(--fd);font-size:var(--sm);font-weight:700;color:var(--red);min-width:46px;padding-left:var(--s3)}
.lrow.coll .l-num{color:var(--gold)}.lrow.wish .l-num{color:var(--blue)}
.l-info{flex:1;padding:var(--s2) 0;min-width:0}
.l-name{font-size:var(--sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-brand{font-size:var(--xs);color:var(--txm)}
.l-acts{display:flex;gap:var(--s2);padding-right:var(--s3)}
.lact{width:32px;height:32px;border-radius:var(--r1);border:1.5px solid var(--bdr);font-size:11px;font-weight:700;background:var(--surf2);color:var(--txm);display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.lact:hover{border-color:var(--gold);color:var(--gold)}
.lact.wb:hover{border-color:var(--blue);color:var(--blue)}
.lact.ac-c{border-color:var(--gold);background:var(--gold);color:#fff}
.lact.ac-w{border-color:var(--blue);background:var(--blue);color:#fff}

/* ══ EMPTY ══ */
.empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:var(--s16);gap:var(--s4);color:var(--txm);text-align:center}
.empty svg{opacity:.25}
.empty p{max-width:28ch;font-size:var(--sm)}

/* ══ MODAL ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:var(--s4)}
.overlay.open{display:flex}
.modal{background:var(--surf2);border-radius:var(--r4);width:100%;max-width:480px;box-shadow:var(--sh3);overflow:hidden;display:flex;flex-direction:column;max-height:90dvh;overflow-y:auto}
.modal-img-wrap{width:100%;height:180px;background:var(--surfo);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0}
.modal-img{width:100%;height:100%;object-fit:contain;padding:var(--s6);transition:opacity .3s}
.modal-img.loading{opacity:0}.modal-img.loaded{opacity:1}
.m-skel{position:absolute;inset:0}
.modal-img.loaded~.m-skel,.modal-img.err~.m-skel{display:none}
.m-fallback{display:none;font-size:3.5rem;position:absolute;inset:0;align-items:center;justify-content:center}
.modal-img.err~.m-fallback{display:flex}
.modal-body{padding:var(--s5) var(--s6) var(--s6)}
.modal-title{font-family:var(--fd);font-size:var(--lg);font-weight:700;margin-bottom:var(--s4)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s3)}
.chk-lbl{display:flex;align-items:center;gap:var(--s2);font-size:var(--sm);cursor:pointer;padding:var(--s2) var(--s3);border-radius:var(--r2);border:1.5px solid var(--bdr);background:var(--surf);transition:all var(--tr)}
.chk-lbl input{display:none}
.chk-icon{width:20px;height:20px;border-radius:var(--r1);border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all var(--tr);flex-shrink:0}
.chk-lbl.coll-lbl.checked{border-color:var(--goldbdr);background:var(--goldbg)}
.chk-lbl.coll-lbl.checked .chk-icon{background:var(--gold);border-color:var(--gold);color:#fff}
.chk-lbl.wish-lbl.checked{border-color:var(--bluebdr);background:var(--bluebg)}
.chk-lbl.wish-lbl.checked .chk-icon{background:var(--blue);border-color:var(--blue);color:#fff}
.m-lbl{font-size:var(--xs);color:var(--txm);display:block;margin-bottom:var(--s1)}
.m-input{width:100%;padding:var(--s2) var(--s3);border:1.5px solid var(--bdr);border-radius:var(--r2);background:var(--surf);resize:vertical;min-height:72px;font-size:var(--sm);margin-bottom:var(--s3)}
.m-input:focus{outline:none;border-color:var(--red)}
.stars-row{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.star{font-size:1.5rem;cursor:pointer;transition:transform var(--tr);line-height:1}
.star:hover{transform:scale(1.25)}
.m-footer{display:flex;justify-content:flex-end;gap:var(--s3)}
.btn-x{padding:var(--s2) var(--s4);border:1.5px solid var(--bdr);border-radius:var(--r2);font-size:var(--sm);background:none;color:var(--txm);transition:all var(--tr)}
.btn-x:hover{border-color:var(--txm);color:var(--tx)}
.btn-s{padding:var(--s2) var(--s6);border-radius:var(--r2);font-size:var(--sm);font-weight:700;background:var(--red);color:#fff;border:none;transition:background var(--tr)}

function em(b){return EMOJI[b]||"🚗"}

// ── STATE ──
let S={}, currentUser=null, syncTimer=null, curF="all", curB="", curV="grid", curM=null, curR=0;
function gs(n){return S[n]||{coll:false,wish:false,note:"",rating:0}}

// ── FIRESTORE ──
async function loadCloud(){
  if(!currentUser) return;
  try{
    const ref=doc(db,"users",currentUser.uid,"data","collection");
    const snap=await getDoc(ref);
    if(snap.exists()) S=snap.data()||{};
    else S={};
  }catch(e){console.warn("load err",e)}
}
function scheduleSave(){
  setSyncStatus("syncing","保存中...");
  clearTimeout(syncTimer);
  syncTimer=setTimeout(saveCloud,1200);
}
async function saveCloud(){
  if(!currentUser) return;
  try{
    const ref=doc(db,"users",currentUser.uid,"data","collection");
    await setDoc(ref,S,{merge:true});
    setSyncStatus("saved","クラウドに保存しました ✓");
    setTimeout(()=>document.getElementById("sync-bar").classList.add("hidden"),2500);
  }catch(e){setSyncStatus("err","保存エラー。再試行中...")}
}
function setSyncStatus(type,msg){
  const bar=document.getElementById("sync-bar"),dot=document.getElementById("sync-dot"),m=document.getElementById("sync-msg");
  bar.classList.remove("hidden");
  dot.className="sync-dot "+type;
  m.textContent=msg;
}

// ── TOAST ──
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2500);
}

// ── RENDER ──
const gc=document.getElementById("gc"),lc=document.getElementById("lc"),es=document.getElementById("es");

function updateStats(){
  let c=0,w=0;
  MODELS.forEach(m=>{const s=gs(m[0]);if(s.coll)c++;if(s.wish)w++;});
  document.getElementById("sc").textContent=c;
  document.getElementById("sw").textContent=w;
  document.getElementById("sm").textContent=150-c;
  const p=Math.round(c/150*100);
  document.getElementById("pf").style.width=p+"%";
  document.getElementById("pl").textContent=c+" / 150 ("+p+"%)";
}

function imgURL(n){return IMG_BASE+String(n).padStart(3,"0")+".jpg"}
function attachImg(el,n,fb){
  el.classList.add("loading");el.src=imgURL(n);
  el.onload=()=>{el.classList.remove("loading");el.classList.add("loaded")};
  el.onerror=()=>{el.classList.remove("loading");el.classList.add("err");if(fb)fb.textContent=em(MODELS.find(m=>m[0]===n)?.[2]||"")};
}

function getFiltered(){
  const q=document.getElementById("si").value.toLowerCase(),b=document.getElementById("bf").value;
  return MODELS.filter(m=>{
    const s=gs(m[0]);
    return(!q||m[1].toLowerCase().includes(q)||m[2].toLowerCase().includes(q)||String(m[0]).includes(q))
      &&(!b||m[2]===b)
      &&(curF==="all"||(curF==="coll"&&s.coll)||(curF==="wish"&&s.wish)||(curF==="miss"&&!s.coll));
  });
}

function makeCard(m){
  const [n,name,brand]=m,s=gs(n);
  const d=document.createElement("div");
  d.className="card"+(s.coll?" coll":"")+(s.wish?" wish":"");
  d.dataset.id=n;d.setAttribute("role","listitem");d.setAttribute("tabindex","0");
  d.innerHTML=`<div class="c-num">No.${String(n).padStart(3,"0")}</div>
    <div class="c-badges">${s.coll?'<span class="bdg bdg-c">✓</span>':""} ${s.wish?'<span class="bdg bdg-w">♥</span>':""}</div>
    <div class="c-img-wrap">
      <img class="c-img loading" src="" alt="${name}" width="170" height="128" loading="lazy" decoding="async">
      <div class="c-skel"></div><div class="c-fallback">${em(brand)}</div>
    </div>
    <div class="c-body">
      <div class="c-name">${name}</div><div class="c-brand">${brand}</div>
      ${s.rating>0?`<div class="c-stars">${"★".repeat(s.rating)}${"☆".repeat(5-s.rating)}</div>`:""}
      ${s.note?`<div class="c-note">${s.note}</div>`:""}
    </div>
    <div class="c-actions">
      <button class="act${s.coll?" ac-c":""}" data-a="coll" data-id="${n}">${s.coll?"✓ 所持":"＋ 所持"}</button>
      <button class="act wb${s.wish?" ac-w":""}" data-a="wish" data-id="${n}">${s.wish?"♥":"♡"}</button>
    </div>`;
  const img=d.querySelector(".c-img"),fb=d.querySelector(".c-fallback");
  new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting){attachImg(img,n,fb);o.disconnect()}})},{rootMargin:"200px"}).observe(img);
  return d;
}

function makeListRow(m){
  const [n,name,brand]=m,s=gs(n);
  const d=document.createElement("div");
  d.className="lrow"+(s.coll?" coll":"")+(s.wish?" wish":"");
  d.dataset.id=n;d.setAttribute("role","listitem");
  d.innerHTML=`<div class="l-img-wrap">
      <img class="l-img loading" src="" alt="${name}" width="80" height="60" loading="lazy" decoding="async">
      <div class="l-skel"></div><div class="l-fallback">${em(brand)}</div>
    </div>
    <div class="l-num">No.${String(n).padStart(3,"0")}</div>
    <div class="l-info"><div class="l-name">${name}</div><div class="l-brand">${brand}${s.rating>0?" · "+"★".repeat(s.rating):""}</div></div>
    <div class="l-acts">
      <button class="lact${s.coll?" ac-c":""}" data-a="coll" data-id="${n}">${s.coll?"✓":"＋"}</button>
      <button class="lact wb${s.wish?" ac-w":""}" data-a="wish" data-id="${n}">${s.wish?"♥":"♡"}</button>
      <button class="lact" data-a="note" data-id="${n}">📝</button>
    </div>`;
  const img=d.querySelector(".l-img"),fb=d.querySelector(".l-fallback");
  new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting){attachImg(img,n,fb);o.disconnect()}})},{rootMargin:"300px"}).observe(img);
  return d;
}

function render(){
  gc.innerHTML="";lc.innerHTML="";
  const items=getFiltered();
  es.style.display=items.length===0?"flex":"none";
  items.forEach(m=>{gc.appendChild(makeCard(m));lc.appendChild(makeListRow(m));});
  updateStats();
}

// ── EVENT DELEGATION ──
document.addEventListener("click",e=>{
  const ab=e.target.closest("[data-a]");
  if(ab){
    e.stopPropagation();
    const id=parseInt(ab.dataset.id),a=ab.dataset.a,s=gs(id);
    if(a==="coll"){s.coll=!s.coll;S[id]=s;scheduleSave();render();toast(s.coll?"✓ 所持に追加しました":"所持を解除しました")}
    else if(a==="wish"){s.wish=!s.wish;S[id]=s;scheduleSave();render();toast(s.wish?"♥ ほしいリストに追加":"ほしいリストから削除")}
    else if(a==="note") openModal(id);
    return;
  }
  const card=e.target.closest(".card,.lrow");
  if(card&&card.dataset.id) openModal(parseInt(card.dataset.id));
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.closest(".card")){e.preventDefault();openModal(parseInt(e.target.closest(".card").dataset.id))}
});

// ── MODAL ──
function openModal(id){
  curM=id;curR=gs(id).rating||0;
  const m=MODELS.find(x=>x[0]===id),s=gs(id);
  document.getElementById("mt").textContent=`No.${String(id).padStart(3,"0")} ${m[1]}`;
  const mc=document.getElementById("mc"),mw=document.getElementById("mw");
  mc.checked=s.coll;mw.checked=s.wish;
  document.getElementById("mn").value=s.note||"";
  document.getElementById("coll-lbl").classList.toggle("checked",s.coll);
  document.getElementById("wish-lbl").classList.toggle("checked",s.wish);
  const mi=document.getElementById("mi"),mf=document.getElementById("mf");
  mi.className="modal-img loading";mi.src="";mf.textContent=em(m[2]);
  attachImg(mi,id,mf);
  updateModalStars(curR);
  document.getElementById("ov").classList.add("open");
  setTimeout(()=>document.getElementById("mn").focus(),100);
}
function closeModal(){document.getElementById("ov").classList.remove("open");curM=null}
function updateModalStars(r){
  document.getElementById("msr").querySelectorAll(".star").forEach((s,i)=>{
    s.textContent=i<r?"★":"☆";s.style.color=i<r?"var(--gold)":"var(--txf)";
  });
}
document.getElementById("msr").addEventListener("click",e=>{
  const s=e.target.closest(".star");if(s){curR=parseInt(s.dataset.s);updateModalStars(curR)}
});
// sync checkbox UI
["mc","mw"].forEach(id=>{
  document.getElementById(id).addEventListener("change",()=>{
    document.getElementById("coll-lbl").classList.toggle("checked",document.getElementById("mc").checked);
    document.getElementById("wish-lbl").classList.toggle("checked",document.getElementById("mw").checked);
  });
});
document.getElementById("mcl").addEventListener("click",closeModal);
document.getElementById("msv").addEventListener("click",()=>{
  if(curM!=null){
    const s=gs(curM);
    s.coll=document.getElementById("mc").checked;
    s.wish=document.getElementById("mw").checked;
    s.note=document.getElementById("mn").value;
    s.rating=curR;
    S[curM]=s;scheduleSave();render();toast("💾 保存しました");
  }
  closeModal();
});
document.getElementById("ov").addEventListener("click",e=>{if(e.target===document.getElementById("ov"))closeModal()});

// ── FILTERS ──
document.querySelectorAll("[data-f]").forEach(b=>{
  b.addEventListener("click",()=>{
    curF=b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x.dataset.f===curF));
    render();
  });
});
document.querySelectorAll("[data-v]").forEach(b=>{
  b.addEventListener("click",()=>{
    curV=b.dataset.v;
    document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===curV));
    gc.classList.toggle("hidden",curV!=="grid");
    lc.classList.toggle("vis",curV==="list");
  });
});
document.getElementById("si").addEventListener("input",render);
document.getElementById("bf").addEventListener("change",render);

// brand filter populate
const brands=[...new Set(MODELS.map(m=>m[2]))].sort((a,b)=>a.localeCompare(b,"ja"));
brands.forEach(b=>{const o=document.createElement("option");o.value=b;o.textContent=b;document.getElementById("bf").appendChild(o)});

// ── THEME ──
(function(){
  const t=document.querySelector("[data-theme-toggle]"),r=document.documentElement;
  let d=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  r.setAttribute("data-theme",d);
  if(t)t.addEventListener("click",()=>{
    d=d==="dark"?"light":"dark";r.setAttribute("data-theme",d);
    t.innerHTML=d==="dark"
      ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

// ── LOGOUT ──
document.getElementById("logout-btn").addEventListener("click",async()=>{
  await signOut(auth);toast("ログアウトしました");
});

// ── AUTH UI ──
const authScreen=document.getElementById("auth-screen");
const verifyScreen=document.getElementById("verify-screen");
const authLoading=document.getElementById("auth-loading");
const authTabs=document.getElementById("auth-tabs");
const authBody=document.getElementById("auth-body");
const appEl=document.getElementById("app");

function showAuth(){
  verifyScreen.style.display="none";
  authScreen.style.display="flex";appEl.classList.remove("visible");
  authLoading.style.display="none";authTabs.style.display="flex";authBody.style.display="block";
}
function showVerify(){
  authScreen.style.display="none";
  appEl.classList.remove("visible");
  verifyScreen.style.display="flex";
}
function showApp(user){
  verifyScreen.style.display="none";
  authScreen.style.display="none";appEl.classList.add("visible");
  document.getElementById("user-label").textContent=user.displayName||user.email;
}

// Auth tabs
document.querySelectorAll(".atab").forEach(t=>{
  t.addEventListener("click",()=>{
    const tab=t.dataset.tab;
    document.querySelectorAll(".atab").forEach(x=>x.classList.toggle("on",x.dataset.tab===tab));
    document.getElementById("login-form").classList.toggle("hidden",tab!=="login");
    document.getElementById("reg-form").classList.toggle("hidden",tab!=="register");
    document.getElementById("login-err").classList.remove("show");
    document.getElementById("reg-err").classList.remove("show");
    document.getElementById("reg-ok").classList.remove("show");
  });
});

// Login
document.getElementById("login-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("login-btn"),errEl=document.getElementById("login-err");
  btn.disabled=true;btn.textContent="ログイン中...";errEl.classList.remove("show");
  try{
    await signInWithEmailAndPassword(auth,document.getElementById("l-email").value,document.getElementById("l-pass").value);
  }catch(err){
    const msgs={"auth/invalid-credential":"メールまたはパスワードが正しくありません","auth/user-not-found":"アカウントが見つかりません","auth/wrong-password":"パスワードが正しくありません","auth/too-many-requests":"試行回数が多すぎます。しばらくしてからお試しください"};
    errEl.textContent=msgs[err.code]||"エラーが発生しました: "+err.message;
    errEl.classList.add("show");
    btn.disabled=false;btn.textContent="ログイン";
  }
});

// Register
document.getElementById("reg-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("reg-btn"),errEl=document.getElementById("reg-err"),okEl=document.getElementById("reg-ok");
  btn.disabled=true;btn.textContent="作成中...";errEl.classList.remove("show");okEl.classList.remove("show");
  try{
    const cred=await createUserWithEmailAndPassword(auth,document.getElementById("r-email").value,document.getElementById("r-pass").value);
    await updateProfile(cred.user,{displayName:document.getElementById("r-name").value});
    await sendEmailVerification(cred.user);
    okEl.textContent="✓ アカウントを作成しました。確認メールを送信しました。";okEl.classList.add("show");
  }catch(err){
    const msgs={"auth/email-already-in-use":"このメールアドレスはすでに使用されています","auth/weak-password":"パスワードは6文字以上にしてください","auth/invalid-email":"メールアドレスの形式が正しくありません"};
    errEl.textContent=msgs[err.code]||"エラーが発生しました: "+err.message;
    errEl.classList.add("show");
    btn.disabled=false;btn.textContent="アカウント作成";
  }
});

// forgot password
document.getElementById("forgot-btn").addEventListener("click", async()=>{
  const email=(document.getElementById("l-email").value||"").trim();
  const errEl=document.getElementById("login-err");
  errEl.classList.remove("show");
  if(!email){errEl.textContent="先にメールアドレスを入力してください";errEl.classList.add("show");return;}
  try{
    await sendPasswordResetEmail(auth,email);
    toast("パスワード再設定メールを送信しました");
  }catch(err){
    const msgs={"auth/invalid-email":"メールアドレスの形式が正しくありません","auth/user-not-found":"アカウントが見つかりません"};
    errEl.textContent=msgs[err.code]||"再設定メールの送信に失敗しました";
    errEl.classList.add("show");
  }
});

document.getElementById("resend-verify-btn").addEventListener("click", async()=>{
  const ok=document.getElementById("verify-ok"), err=document.getElementById("verify-err");
  ok.classList.remove("show"); err.classList.remove("show");
  try{
    if(auth.currentUser){
      await sendEmailVerification(auth.currentUser);
      ok.textContent="確認メールを再送信しました。";
      ok.classList.add("show");
    }
  }catch(e){
    err.textContent="確認メールの再送信に失敗しました。少し待って再試行してください。";
    err.classList.add("show");
  }
});

document.getElementById("check-verify-btn").addEventListener("click", async()=>{
  const ok=document.getElementById("verify-ok"), err=document.getElementById("verify-err");
  ok.classList.remove("show"); err.classList.remove("show");
  try{
    if(auth.currentUser){
      await reload(auth.currentUser);
      if(auth.currentUser.emailVerified){
        currentUser=auth.currentUser;
        authLoading.style.display="block";authTabs.style.display="none";authBody.style.display="none";
        await loadCloud();
        render();
        showApp(auth.currentUser);
        toast("メール認証が完了しました");
      } else {
        err.textContent="まだメール認証が完了していません。受信箱のリンクを確認してください。";
        err.classList.add("show");
      }
    }
  }catch(e){
    err.textContent="認証状態の確認に失敗しました。";
    err.classList.add("show");
  }
});

document.getElementById("verify-logout-btn").addEventListener("click", async()=>{ await signOut(auth); });

// ── AUTH STATE LISTENER ──
onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    authLoading.style.display="block";authTabs.style.display="none";authBody.style.display="none";
    await reload(user);
    if(!user.emailVerified){
      showVerify();
      return;
    }
    await loadCloud();
    render();
    showApp(user);
  } else {
    currentUser=null;S={};
    showAuth();
  }
});
</script>
</body>
