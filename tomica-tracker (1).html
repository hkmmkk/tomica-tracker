<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トミカ コレクション トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
  --color-bg:#f2f1ed;
  --color-surface:#fafaf7;
  --color-surface-2:#ffffff;
  --color-surface-offset:#e8e6e0;
  --color-divider:#dddbd5;
  --color-border:#d0cdc7;
  --color-text:#1a1814;
  --color-text-muted:#6b6965;
  --color-text-faint:#aaa9a5;
  --color-text-inverse:#ffffff;
  --color-primary:#c41e1e;
  --color-primary-hover:#a31515;
  --color-primary-highlight:#fce8e8;
  --color-gold:#b87a00;
  --color-gold-bg:#fdf6e3;
  --color-gold-border:#e8c966;
  --color-blue:#1a5fa8;
  --color-blue-bg:#e8f0fb;
  --color-blue-border:#6fa3dc;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.07);
  --shadow-md:0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg:0 12px 36px rgba(0,0,0,0.13);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1.125rem;--radius-full:9999px;
  --font-d:'Oswald',sans-serif;--font-b:'Noto Sans JP',sans-serif;
  --tx-xs:clamp(0.7rem,0.65rem+0.2vw,0.8rem);
  --tx-sm:clamp(0.8rem,0.75rem+0.3vw,0.9rem);
  --tx-base:clamp(0.9rem,0.85rem+0.25vw,1rem);
  --tx-lg:clamp(1.1rem,0.95rem+0.7vw,1.4rem);
  --tx-xl:clamp(1.4rem,1.1rem+1.2vw,2rem);
  --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp5:1.25rem;--sp6:1.5rem;--sp8:2rem;--sp10:2.5rem;--sp12:3rem;--sp16:4rem;
  --tr:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --color-bg:#111009;--color-surface:#1a1916;--color-surface-2:#222018;
  --color-surface-offset:#181715;--color-divider:#2a2824;--color-border:#363330;
  --color-text:#d5d2cc;--color-text-muted:#7a7773;--color-text-faint:#4e4c48;
  --color-text-inverse:#ffffff;
  --color-primary:#e03535;--color-primary-hover:#f05050;--color-primary-highlight:#3a1a1a;
  --color-gold:#d4a020;--color-gold-bg:#2a2210;--color-gold-border:#6a5010;
  --color-blue:#5090d8;--color-blue-bg:#121e2e;--color-blue-border:#1e3a5a;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);--shadow-md:0 4px 16px rgba(0,0,0,0.4);--shadow-lg:0 12px 36px rgba(0,0,0,0.5);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#111009;--color-surface:#1a1916;--color-surface-2:#222018;
  --color-surface-offset:#181715;--color-divider:#2a2824;--color-border:#363330;
  --color-text:#d5d2cc;--color-text-muted:#7a7773;--color-text-faint:#4e4c48;
  --color-text-inverse:#ffffff;--color-primary:#e03535;--color-primary-hover:#f05050;
  --color-primary-highlight:#3a1a1a;--color-gold:#d4a020;--color-gold-bg:#2a2210;
  --color-gold-border:#6a5010;--color-blue:#5090d8;--color-blue-bg:#121e2e;--color-blue-border:#1e3a5a;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);--shadow-md:0 4px 16px rgba(0,0,0,0.4);--shadow-lg:0 12px 36px rgba(0,0,0,0.5);
}}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-b);font-size:var(--tx-base);color:var(--color-text);background:var(--color-bg);transition:background var(--tr),color var(--tr)}
img,svg{display:block;max-width:100%}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,select{font:inherit;color:inherit}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--color-primary);box-shadow:0 2px 16px rgba(0,0,0,.28)}
.hdr-i{max-width:1340px;margin:0 auto;padding:0 var(--sp6);display:flex;align-items:center;gap:var(--sp4);height:58px}
.logo{display:flex;align-items:center;gap:var(--sp3);text-decoration:none;color:#fff;flex-shrink:0}
.logo-svg{width:36px;height:36px}
.logo-text{font-family:var(--font-d);font-size:1.3rem;font-weight:700;letter-spacing:.06em;line-height:1}
.logo-sub{font-size:var(--tx-xs);opacity:.75;letter-spacing:.08em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp3)}
.theme-btn{width:34px;height:34px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);color:#fff;transition:background var(--tr)}
.theme-btn:hover{background:rgba(255,255,255,.28)}

/* ── STATS ── */
.stats{background:var(--color-surface);border-bottom:1px solid var(--color-divider);padding:var(--sp4) var(--sp6)}
.stats-i{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--sp4) var(--sp8);align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-lbl{font-size:var(--tx-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.07em}
.stat-val{font-family:var(--font-d);font-size:var(--tx-lg);font-weight:600;line-height:1.1}
.v-red{color:var(--color-primary)}.v-gold{color:var(--color-gold)}.v-blue{color:var(--color-blue)}
.prog-wrap{flex:1;min-width:200px}
.prog-bar{height:9px;border-radius:var(--radius-full);background:var(--color-surface-offset);overflow:hidden;margin-bottom:var(--sp1)}
.prog-fill{height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--color-primary),var(--color-gold));transition:width .7s cubic-bezier(.16,1,.3,1)}
.prog-lbl{font-size:var(--tx-xs);color:var(--color-text-muted);text-align:right}

/* ── CONTROLS ── */
.ctrl{background:var(--color-surface);border-bottom:1px solid var(--color-divider);padding:var(--sp3) var(--sp6);position:sticky;top:58px;z-index:90}
.ctrl-i{max-width:1340px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--sp3);align-items:center}
.srch-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
.srch-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);pointer-events:none}
.srch{width:100%;padding:var(--sp2) var(--sp3) var(--sp2) 34px;border:1.5px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-2);font-size:var(--tx-sm);transition:border-color var(--tr),box-shadow var(--tr)}
.srch:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-highlight)}
.fbtns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.fb{padding:var(--sp1) var(--sp3);border-radius:var(--radius-full);font-size:var(--tx-xs);font-weight:500;border:1.5px solid var(--color-border);background:var(--color-surface-2);color:var(--color-text-muted);transition:all var(--tr)}
.fb:hover{border-color:var(--color-primary);color:var(--color-primary)}
.fb.on{border-color:var(--color-primary);background:var(--color-primary);color:#fff}
.fb.gold.on{border-color:var(--color-gold);background:var(--color-gold);color:#fff}
.fb.blue.on{border-color:var(--color-blue);background:var(--color-blue);color:#fff}
.sel{padding:var(--sp1) var(--sp3);border-radius:var(--radius-md);font-size:var(--tx-xs);border:1.5px solid var(--color-border);background:var(--color-surface-2);color:var(--color-text);transition:border-color var(--tr)}
.sel:focus{outline:none;border-color:var(--color-primary)}
.vtog{display:flex;gap:2px;background:var(--color-surface-offset);border-radius:var(--radius-md);padding:2px}
.vb{padding:var(--sp1) var(--sp2);border-radius:calc(var(--radius-md) - 2px);font-size:var(--tx-xs);transition:all var(--tr);color:var(--color-text-muted)}
.vb.on{background:var(--color-surface-2);color:var(--color-text);box-shadow:var(--shadow-sm)}

/* ── MAIN ── */
.main{max-width:1340px;margin:0 auto;padding:var(--sp6) var(--sp6) var(--sp16)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:var(--sp4)}
.grid.hidden{display:none}

/* ── CARD ── */
.card{
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;position:relative;
  display:flex;flex-direction:column;
  transition:box-shadow var(--tr),transform var(--tr),border-color var(--tr);
}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--color-primary)}
.card:active{transform:translateY(-1px)}
.card.coll{border-color:var(--color-gold-border);background:var(--color-gold-bg)}
.card.wish{border-color:var(--color-blue-border);background:var(--color-blue-bg)}
.card.coll.wish{border-color:var(--color-gold-border)}

/* number badge top-left */
.c-num{
  position:absolute;top:0;left:0;z-index:2;
  font-family:var(--font-d);font-size:var(--tx-xs);font-weight:700;letter-spacing:.04em;
  background:var(--color-primary);color:#fff;
  padding:2px 7px;border-radius:0 0 var(--radius-sm) 0;
  line-height:1.4;
}
.card.coll .c-num{background:var(--color-gold)}
.card.wish .c-num{background:var(--color-blue)}
.card.coll.wish .c-num{background:var(--color-gold)}

/* status icons top-right */
.c-badges{position:absolute;top:var(--sp1);right:var(--sp1);z-index:2;display:flex;gap:2px}
.bdg{width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;line-height:1}
.bdg-c{background:var(--color-gold);color:#fff}
.bdg-w{background:var(--color-blue);color:#fff}

/* image area */
.c-img-wrap{
  width:100%;aspect-ratio:4/3;
  background:var(--color-surface-offset);
  overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.c-img{
  width:100%;height:100%;object-fit:contain;
  padding:var(--sp3);
  transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;
}
.card:hover .c-img{transform:scale(1.08)}
.c-img.loading{opacity:0}
.c-img.loaded{opacity:1}
/* skeleton shimmer while loading */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.c-skeleton{
  position:absolute;inset:0;
  background:linear-gradient(90deg,var(--color-surface-offset) 25%,var(--color-surface-2) 50%,var(--color-surface-offset) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  border-radius:0;
}
.c-img.loaded + .c-skeleton,.c-img.err + .c-skeleton{display:none}
/* fallback emoji when image fails */
.c-fallback{display:none;font-size:2.5rem;position:absolute;inset:0;align-items:center;justify-content:center}
.c-img.err ~ .c-fallback{display:flex}

.c-body{padding:var(--sp2) var(--sp3) var(--sp1);flex:1;display:flex;flex-direction:column;gap:1px}
.c-name{font-size:var(--tx-xs);font-weight:700;line-height:1.35;color:var(--color-text)}
.c-brand{font-size:var(--tx-xs);color:var(--color-text-muted)}
.c-stars{font-size:10px;color:var(--color-gold);line-height:1;margin-top:2px}
.c-note{font-size:9px;color:var(--color-text-muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:2px}

.c-actions{display:flex;gap:var(--sp2);padding:var(--sp2) var(--sp3) var(--sp3)}
.act{
  flex:1;min-height:30px;
  padding:2px var(--sp2);border-radius:var(--radius-sm);
  border:1.5px solid var(--color-border);
  font-size:10px;font-weight:600;letter-spacing:.02em;
  background:var(--color-surface-2);color:var(--color-text-muted);
  display:flex;align-items:center;justify-content:center;gap:3px;
  transition:all var(--tr);
}
.act:hover:not(.ac-c):not(.ac-w){border-color:var(--color-gold);color:var(--color-gold)}
.act.wb:hover:not(.ac-w){border-color:var(--color-blue);color:var(--color-blue)}
.act.ac-c{border-color:var(--color-gold);background:var(--color-gold);color:#fff}
.act.ac-w{border-color:var(--color-blue);background:var(--color-blue);color:#fff}

/* ── LIST VIEW ── */
.listv{display:none;flex-direction:column;gap:var(--sp2)}
.listv.vis{display:flex}
.lrow{
  display:flex;align-items:center;gap:var(--sp4);
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-md);overflow:hidden;cursor:pointer;
  transition:all var(--tr);
}
.lrow:hover{border-color:var(--color-primary);box-shadow:var(--shadow-sm);transform:translateX(3px)}
.lrow.coll{border-color:var(--color-gold-border);background:var(--color-gold-bg)}
.lrow.wish{border-color:var(--color-blue-border);background:var(--color-blue-bg)}
.l-img-wrap{width:80px;height:60px;flex-shrink:0;overflow:hidden;background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;position:relative}
.l-img{width:100%;height:100%;object-fit:contain;padding:var(--sp2);transition:opacity .3s}
.l-img.loading{opacity:0}
.l-img.loaded{opacity:1}
.l-skel{position:absolute;inset:0;background:linear-gradient(90deg,var(--color-surface-offset) 25%,var(--color-surface-2) 50%,var(--color-surface-offset) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.l-img.loaded ~ .l-skel,.l-img.err ~ .l-skel{display:none}
.l-fallback{display:none;font-size:1.6rem;position:absolute;inset:0;align-items:center;justify-content:center}
.l-img.err ~ .l-fallback{display:flex}
.l-num{font-family:var(--font-d);font-size:var(--tx-sm);font-weight:700;color:var(--color-primary);min-width:46px;padding-left:var(--sp3)}
.lrow.coll .l-num{color:var(--color-gold)}
.lrow.wish .l-num{color:var(--color-blue)}
.l-info{flex:1;padding:var(--sp2) 0;min-width:0}
.l-name{font-size:var(--tx-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-brand{font-size:var(--tx-xs);color:var(--color-text-muted)}
.l-acts{display:flex;gap:var(--sp2);padding-right:var(--sp3)}
.lact{width:32px;height:32px;border-radius:var(--radius-sm);border:1.5px solid var(--color-border);font-size:11px;font-weight:700;background:var(--color-surface-2);color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.lact:hover{border-color:var(--color-gold);color:var(--color-gold)}
.lact.wb:hover{border-color:var(--color-blue);color:var(--color-blue)}
.lact.ac-c{border-color:var(--color-gold);background:var(--color-gold);color:#fff}
.lact.ac-w{border-color:var(--color-blue);background:var(--color-blue);color:#fff}

/* ── EMPTY ── */
.empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp16);gap:var(--sp4);color:var(--color-text-muted);text-align:center}
.empty svg{opacity:.25}
.empty p{max-width:28ch;font-size:var(--tx-sm)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:var(--sp4)}
.overlay.open{display:flex}
.modal{background:var(--color-surface-2);border-radius:var(--radius-xl);width:100%;max-width:480px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column}
.modal-img-wrap{width:100%;height:180px;background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.modal-img{width:100%;height:100%;object-fit:contain;padding:var(--sp6);transition:opacity .3s}
.modal-img.loading{opacity:0}
.modal-img.loaded{opacity:1}
.m-skel{position:absolute;inset:0;background:linear-gradient(90deg,var(--color-surface-offset) 25%,var(--color-surface-2) 50%,var(--color-surface-offset) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.modal-img.loaded ~ .m-skel,.modal-img.err ~ .m-skel{display:none}
.m-fallback{display:none;font-size:4rem;position:absolute;inset:0;align-items:center;justify-content:center}
.modal-img.err ~ .m-fallback{display:flex}
.modal-body{padding:var(--sp5) var(--sp6) var(--sp6)}
.modal-title{font-family:var(--font-d);font-size:var(--tx-lg);font-weight:700;margin-bottom:var(--sp4)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3);margin-bottom:var(--sp3)}
.chk-lbl{display:flex;align-items:center;gap:var(--sp2);font-size:var(--tx-sm);cursor:pointer;padding:var(--sp2) var(--sp3);border-radius:var(--radius-md);border:1.5px solid var(--color-border);background:var(--color-surface);transition:all var(--tr)}
.chk-lbl:has(input:checked).coll-lbl{border-color:var(--color-gold-border);background:var(--color-gold-bg)}
.chk-lbl:has(input:checked).wish-lbl{border-color:var(--color-blue-border);background:var(--color-blue-bg)}
.chk-lbl input{display:none}
.chk-icon{width:20px;height:20px;border-radius:var(--radius-sm);border:2px solid var(--color-border);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all var(--tr);flex-shrink:0}
.chk-lbl:has(input:checked).coll-lbl .chk-icon{background:var(--color-gold);border-color:var(--color-gold);color:#fff}
.chk-lbl:has(input:checked).wish-lbl .chk-icon{background:var(--color-blue);border-color:var(--color-blue);color:#fff}
.m-lbl{font-size:var(--tx-xs);color:var(--color-text-muted);display:block;margin-bottom:var(--sp1)}
.m-input{width:100%;padding:var(--sp2) var(--sp3);border:1.5px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);resize:vertical;min-height:72px;font-size:var(--tx-sm);margin-bottom:var(--sp3)}
.m-input:focus{outline:none;border-color:var(--color-primary)}
.stars-row{display:flex;gap:var(--sp2);margin-bottom:var(--sp4)}
.star{font-size:1.5rem;cursor:pointer;transition:transform var(--tr);line-height:1}
.star:hover{transform:scale(1.25)}
.m-footer{display:flex;justify-content:flex-end;gap:var(--sp3)}
.btn-x{padding:var(--sp2) var(--sp4);border:1.5px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--tx-sm);background:none;color:var(--color-text-muted);transition:all var(--tr)}
.btn-x:hover{border-color:var(--color-text-muted);color:var(--color-text)}
.btn-s{padding:var(--sp2) var(--sp6);border-radius:var(--radius-md);font-size:var(--tx-sm);font-weight:700;background:var(--color-primary);color:#fff;border:none;transition:background var(--tr)}
.btn-s:hover{background:var(--color-primary-hover)}

@media(max-width:600px){
  .hdr-i,.stats,.ctrl-i,.main{padding-left:var(--sp4);padding-right:var(--sp4)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(145px,100%),1fr));gap:var(--sp3)}
  .logo-text{font-size:1.1rem}
  .modal{max-height:90dvh;overflow-y:auto}
  .modal-img-wrap{height:140px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-i">
    <a class="logo" href="#">
      <svg class="logo-svg" viewBox="0 0 36 36" fill="none" aria-label="Logo">
        <rect width="36" height="36" rx="7" fill="white"/>
        <rect x="3" y="17" width="30" height="11" rx="3" fill="#c41e1e"/>
        <rect x="6" y="13" width="18" height="8" rx="2" fill="#c41e1e"/>
        <circle cx="10" cy="28" r="3.5" fill="#222"/><circle cx="10" cy="28" r="1.8" fill="#bbb"/>
        <circle cx="26" cy="28" r="3.5" fill="#222"/><circle cx="26" cy="28" r="1.8" fill="#bbb"/>
        <rect x="22" y="18" width="8" height="5" rx="1" fill="#90caf9" opacity=".85"/>
      </svg>
      <div>
        <div class="logo-text">TOMICA TRACKER</div>
        <div class="logo-sub">コレクション管理</div>
      </div>
    </a>
    <div class="hdr-right">
      <button class="theme-btn" data-theme-toggle aria-label="テーマ切替">

// Image helpers
function imgURL(n){return IMG_BASE+String(n).padStart(3,"0")+".jpg"}
function attachImg(el, n, fallbackEl){
  el.classList.add("loading");
  el.src = imgURL(n);
  el.onload=()=>{el.classList.remove("loading");el.classList.add("loaded")}
  el.onerror=()=>{el.classList.remove("loading");el.classList.add("err");if(fallbackEl)fallbackEl.textContent=em(MODELS.find(m=>m[0]===n)?.[2]||"")}
}

const si=document.getElementById("si"),bf=document.getElementById("bf");

// Brand filter populate
const brands=[...new Set(MODELS.map(m=>m[2]))].sort((a,b)=>a.localeCompare(b,"ja"));
brands.forEach(b=>{const o=document.createElement("option");o.value=b;o.textContent=b;bf.appendChild(o)});

let curF="all",curB="",curV="grid",curM=null,curR=0;

function updateStats(){
  let c=0,w=0;
  MODELS.forEach(m=>{const s=gs(m[0]);if(s.coll)c++;if(s.wish)w++;});
  document.getElementById("sc").textContent=c;
  document.getElementById("sw").textContent=w;
  document.getElementById("sm").textContent=150-c;
  const p=Math.round(c/150*100);
  document.getElementById("pf").style.width=p+"%";
  document.getElementById("pl").textContent=c+" / 150 ("+p+"%)";
}

function getFiltered(){
  const q=si.value.toLowerCase(),b=bf.value;
  return MODELS.filter(m=>{
    const s=gs(m[0]);
    const qm=!q||m[1].toLowerCase().includes(q)||m[2].toLowerCase().includes(q)||String(m[0]).includes(q);
    const bm=!b||m[2]===b;
    const fm=curF==="all"||(curF==="coll"&&s.coll)||(curF==="wish"&&s.wish)||(curF==="miss"&&!s.coll);
    return qm&&bm&&fm;
  });
}

function makeCard(m){
  const [n,name,brand]=m,s=gs(n);
  const d=document.createElement("div");
  d.className="card"+(s.coll?" coll":"")+(s.wish?" wish":"");
  d.dataset.id=n;d.setAttribute("role","listitem");d.setAttribute("tabindex","0");
  d.innerHTML=`
    <div class="c-num">No.${String(n).padStart(3,"0")}</div>
    <div class="c-badges">
      ${s.coll?'<span class="bdg bdg-c">✓</span>':""}
      ${s.wish?'<span class="bdg bdg-w">♥</span>':""}
    </div>
    <div class="c-img-wrap">
      <img class="c-img loading" data-n="${n}" src="" alt="${name}" width="170" height="128" loading="lazy" decoding="async">
      <div class="c-skeleton"></div>
      <div class="c-fallback">${em(brand)}</div>
    </div>
    <div class="c-body">
      <div class="c-name">${name}</div>
      <div class="c-brand">${brand}</div>
      ${s.rating>0?`<div class="c-stars">${"★".repeat(s.rating)}${"☆".repeat(5-s.rating)}</div>`:""}
      ${s.note?`<div class="c-note">${s.note}</div>`:""}
    </div>
    <div class="c-actions">
      <button class="act${s.coll?" ac-c":""}" data-a="coll" data-id="${n}" aria-label="${s.coll?"所持解除":"所持に追加"}">${s.coll?"✓ 所持":"＋ 所持"}</button>
      <button class="act wb${s.wish?" ac-w":""}" data-a="wish" data-id="${n}" aria-label="${s.wish?"ほしい解除":"ほしいリスト"}">　${s.wish?"♥":"♡"}　</button>
    </div>`;
  // lazy-load image via IntersectionObserver
  const img=d.querySelector(".c-img");
  const fb=d.querySelector(".c-fallback");
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){attachImg(img,n,fb);obs.disconnect();}});
  },{rootMargin:"200px"});
  obs.observe(img);
  return d;
}

function makeListRow(m){
  const [n,name,brand]=m,s=gs(n);
  const d=document.createElement("div");
  d.className="lrow"+(s.coll?" coll":"")+(s.wish?" wish":"");
  d.dataset.id=n;d.setAttribute("role","listitem");
  d.innerHTML=`
    <div class="l-img-wrap">
      <img class="l-img loading" data-n="${n}" src="" alt="${name}" width="80" height="60" loading="lazy" decoding="async">
      <div class="l-skel"></div>
      <div class="l-fallback">${em(brand)}</div>
    </div>
    <div class="l-num">No.${String(n).padStart(3,"0")}</div>
    <div class="l-info">
      <div class="l-name">${name}</div>
      <div class="l-brand">${brand}${s.rating>0?" · "+"★".repeat(s.rating):""}</div>
    </div>
    <div class="l-acts">
      <button class="lact${s.coll?" ac-c":""}" data-a="coll" data-id="${n}" aria-label="${s.coll?"解除":"所持"}">${s.coll?"✓":"＋"}</button>
      <button class="lact wb${s.wish?" ac-w":""}" data-a="wish" data-id="${n}" aria-label="${s.wish?"解除":"ほしい"}">${s.wish?"♥":"♡"}</button>
      <button class="lact" data-a="note" data-id="${n}" aria-label="メモ">📝</button>
    </div>`;
  const img=d.querySelector(".l-img"),fb=d.querySelector(".l-fallback");
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){attachImg(img,n,fb);obs.disconnect();}});
  },{rootMargin:"300px"});
  obs.observe(img);
  return d;
}

function render(){
  gc.innerHTML="";lc.innerHTML="";
  const items=getFiltered();
  es.style.display=items.length===0?"flex":"none";

// Event delegation
document.addEventListener("click",e=>{
  const abtn=e.target.closest("[data-a]");
  if(abtn){
    e.stopPropagation();
    const id=parseInt(abtn.dataset.id),a=abtn.dataset.a,s=gs(id);
    if(a==="coll"){s.coll=!s.coll;S[id]=s;save();render();}
    else if(a==="wish"){s.wish=!s.wish;S[id]=s;save();render();}
    else if(a==="note"){openModal(id);}
    return;
  }
  const card=e.target.closest(".card,.lrow");
  if(card&&card.dataset.id)openModal(parseInt(card.dataset.id));
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    const card=e.target.closest(".card");
    if(card&&card.dataset.id){e.preventDefault();openModal(parseInt(card.dataset.id));}
  }
  if(e.key==="Escape")closeModal();
});

// Modal
function openModal(id){
  curM=id;curR=gs(id).rating||0;
  const m=MODELS.find(x=>x[0]===id),s=gs(id);
  mt.textContent=`No.${String(id).padStart(3,"0")} ${m[1]}`;
  mc.checked=s.coll;mw.checked=s.wish;mn.value=s.note||"";
  // reset and load modal image
  mi.className="modal-img loading";mi.src="";mf.textContent=em(m[2]);
  attachImg(mi,id,mf);
  updateModalStars(curR);
  ov.classList.add("open");
  setTimeout(()=>mn.focus(),100);
}
function closeModal(){ov.classList.remove("open");curM=null}
function updateModalStars(r){
  msr.querySelectorAll(".star").forEach((s,i)=>{
    s.textContent=i<r?"★":"☆";
    s.style.color=i<r?"var(--color-gold)":"var(--color-text-faint)";
  });
}
msr.addEventListener("click",e=>{
  const s=e.target.closest(".star");
  if(s){curR=parseInt(s.dataset.s);updateModalStars(curR);}
});
document.getElementById("mcl").addEventListener("click",closeModal);
document.getElementById("msv").addEventListener("click",()=>{
  if(curM!=null){
    const s=gs(curM);
    s.coll=mc.checked;s.wish=mw.checked;s.note=mn.value;s.rating=curR;
    S[curM]=s;save();render();
  }
  closeModal();
});
ov.addEventListener("click",e=>{if(e.target===ov)closeModal()});

// Filter buttons
document.querySelectorAll("[data-f]").forEach(b=>{
  b.addEventListener("click",()=>{
    curF=b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x.dataset.f===curF));
    render();
  });
});

// View toggle
document.querySelectorAll("[data-v]").forEach(b=>{
  b.addEventListener("click",()=>{
    curV=b.dataset.v;
    document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===curV));
    gc.classList.toggle("hidden",curV!=="grid");
    lc.classList.toggle("vis",curV==="list");
  });
});

si.addEventListener("input",render);
bf.addEventListener("change",render);

// Theme
(function(){
  const t=document.querySelector("[data-theme-toggle]"),r=document.documentElement;
  let d=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  r.setAttribute("data-theme",d);
  if(t)t.addEventListener("click",()=>{
    d=d==="dark"?"light":"dark";
    r.setAttribute("data-theme",d);
    t.innerHTML=d==="dark"
      ?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

render();
</script>
